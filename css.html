<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: purple;
        }

        p {
            font-size: 18px;
        }

        .caja {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS3</h1>

    <div class="caja">
        <h2>¿Qué es CSS?</h2>
        <p>
            CSS permite dar diseño y estilo a las páginas web.
        </p>
    </div>

</body>

</html>
