<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Parcial - EmailJS</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Formulario de contacto de Carlos Arias</h1>
        <p>Desarrollo Web Full Stack - Primer Parcial</p>
    </header>
    <main>
        <section>
            <h2>Contactame</h2>
            <p class="descripcion">
                Completa el formulario para enviar tu mensaje por correo electrónico.
            </p>
            <form id="formularioCorreo">
                <label for="nombre">Nombre completo:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    required
                >
                <label for="correo">Correo electrónico:</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >
                <label for="asunto">Asunto:</label>
                <input
                    type="text"
                    id="asunto"
                    name="asunto"
                    placeholder="Escribe el asunto"
                    required
                >
                <label for="mensaje">Mensaje:</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="5"
                    placeholder="Escribe tu mensaje aquí"
                    required
                ></textarea>
                <button type="submit" id="botonEnviar">
                    Enviar correo
                </button>
                <p id="notificacion" role="status" aria-live="polite" hidden></p>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Carlos Arias | Primer Parcial</p>
    </footer>
</body>
</html>
